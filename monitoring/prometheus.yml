global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "online-retail-app"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 3s
    static_configs:
      # Targets will hit retail-app container or host machine
      - targets: ["retail-app:8080", "host.docker.internal:8080"]
        labels:
          application: "online-retail-app"
          environment: "production"
