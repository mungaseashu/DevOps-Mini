server.port=8080
spring.application.name=online-retail-app

# Spring Boot Actuator & Prometheus Configuration
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true

# Enable Kubernetes Liveness and Readiness Probes
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Prometheus Metrics Tags & Customizations
management.metrics.tags.application=online-retail-app
management.metrics.tags.environment=production
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.sla.http.server.requests=100ms,250ms,500ms,1s
